<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="100%" height="440">
  <defs>
    <!-- Dark IDE Background -->
    <linearGradient id="ideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#02050b" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <!-- SEQUENTIAL TOP-TO-BOTTOM LINE-BY-LINE TYPING CLIPS (Duration: 14s) -->
    <!-- Line 1: 0s -> 1.5s -->
    <clipPath id="cLine1">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0; 520; 520; 0" keyTimes="0; 0.11; 0.90; 1" dur="14s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Line 2: 1.5s -> 3.0s -->
    <clipPath id="cLine2">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0; 0; 480; 480; 0" keyTimes="0; 0.11; 0.22; 0.90; 1" dur="14s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Line 3: 3.0s -> 4.5s -->
    <clipPath id="cLine3">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0; 0; 560; 560; 0" keyTimes="0; 0.22; 0.33; 0.90; 1" dur="14s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Line 4: 4.5s -> 6.0s -->
    <clipPath id="cLine4">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0; 0; 430; 430; 0" keyTimes="0; 0.33; 0.44; 0.90; 1" dur="14s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Line 5: 6.0s -> 7.5s -->
    <clipPath id="cLine5">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0; 0; 590; 590; 0" keyTimes="0; 0.44; 0.55; 0.90; 1" dur="14s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Line 6: 7.5s -> 9.0s -->
    <clipPath id="cLine6">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0; 0; 460; 460; 0" keyTimes="0; 0.55; 0.66; 0.90; 1" dur="14s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Line 7: 9.0s -> 10.5s -->
    <clipPath id="cLine7">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0; 0; 30; 30; 0" keyTimes="0; 0.66; 0.77; 0.90; 1" dur="14s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <!-- IDE Outer Frame -->
  <rect width="940" height="440" rx="12" fill="url(#ideBg)" stroke="#00F5FF" stroke-width="1.8" filter="url(#glowCyan)" />

  <!-- Top Navigation Header -->
  <rect width="940" height="38" rx="12" fill="#0b1329" stroke="#00F5FF" stroke-width="0.5" />
  <circle cx="22" cy="19" r="6" fill="#EF4444" />
  <circle cx="40" cy="19" r="6" fill="#F59E0B" />
  <circle cx="58" cy="19" r="6" fill="#10B981" filter="url(#glowGreen)" />

  <!-- Tabs -->
  <g font-family="'Fira Code', 'Cascadia Code', monospace" font-size="12" font-weight="bold">
    <rect x="85" y="6" width="165" height="32" rx="5" fill="#1e293b" stroke="#00F5FF" stroke-width="1" />
    <text x="102" y="27" fill="#00F5FF">🦀 kernel_engine.rs</text>

    <rect x="256" y="6" width="150" height="32" rx="5" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
    <text x="270" y="27" fill="#64748B">🧠 reasoning_cot.py</text>
  </g>

  <!-- Sidebar File Explorer -->
  <rect x="0" y="38" width="48" height="402" fill="#050a14" stroke="#0f172a" stroke-width="1" />
  <g font-size="15" text-anchor="middle" fill="#64748B">
    <text x="24" y="75" fill="#00F5FF">📁</text>
    <text x="24" y="118">🔍</text>
    <text x="24" y="161">🌿</text>
    <text x="24" y="204" fill="#10B981">⚡</text>
    <text x="24" y="247">⚙️</text>
  </g>

  <!-- Line Numbers (14px Legibility) -->
  <g font-family="'Fira Code', monospace" font-size="12" fill="#475569" font-weight="bold">
    <text x="62" y="72">01</text>
    <text x="62" y="98">02</text>
    <text x="62" y="124">03</text>
    <text x="62" y="150">04</text>
    <text x="62" y="176">05</text>
    <text x="62" y="202">06</text>
    <text x="62" y="228">07</text>
    <text x="62" y="254">08</text>
    <text x="62" y="280">09</text>
    <text x="62" y="306">10</text>
  </g>

  <!-- HIGH-CONTRAST CLEAR RUST CODE WITH LINE-BY-LINE TOP-TO-BOTTOM TYPING -->
  <g font-family="'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="13" font-weight="bold" transform="translate(95, 72)">

    <!-- Static Header Comments -->
    <text y="0"><tspan fill="#64748B">// Real-Time Async Kernel Sentinel &amp; eBPF Probe</tspan></text>
    <text y="26"><tspan fill="#F43F5E">use</tspan> <tspan fill="#F59E0B">tokio::sync::mpsc</tspan>;</text>

    <!-- Line 1: Types 0s -> 1.5s -->
    <g transform="translate(0, 52)">
      <g clip-path="url(#cLine1)">
        <text y="0">
          <tspan fill="#F43F5E">pub async fn</tspan> <tspan fill="#38BDF8">start_kernel_probe</tspan>(tx: <tspan fill="#F59E0B">Sender</tspan>) -&gt; <tspan fill="#10B981">Result&lt;()&gt;</tspan> {
        </text>
      </g>
    </g>

    <!-- Line 2: Types 1.5s -> 3.0s -->
    <g transform="translate(0, 78)">
      <g clip-path="url(#cLine2)">
        <text y="0">
          <tspan fill="#CBD5E1">    let</tspan> <tspan fill="#F43F5E">mut</tspan> bpf = <tspan fill="#F59E0B">Bpf</tspan>::load_file(<tspan fill="#10B981">"target/ebpf/sentinel.o"</tspan>)?;
        </text>
      </g>
    </g>

    <!-- Line 3: Types 3.0s -> 4.5s -->
    <g transform="translate(0, 104)">
      <g clip-path="url(#cLine3)">
        <text y="0">
          <tspan fill="#CBD5E1">    let</tspan> probe: &amp;<tspan fill="#F43F5E">mut</tspan> <tspan fill="#F59E0B">KProbe</tspan> = bpf.program_mut(<tspan fill="#10B981">"sys_enter_execve"</tspan>)? try_into()?;
        </text>
      </g>
    </g>

    <!-- Line 4: Types 4.5s -> 6.0s -->
    <g transform="translate(0, 130)">
      <g clip-path="url(#cLine4)">
        <text y="0">
          <tspan fill="#38BDF8">    probe.attach</tspan>(<tspan fill="#10B981">"sys_enter_execve"</tspan>, <tspan fill="#00F5FF">0</tspan>)?; <tspan fill="#64748B">// Ring 0 Hook</tspan>
        </text>
      </g>
    </g>

    <!-- Line 5: Types 6.0s -> 7.5s -->
    <g transform="translate(0, 156)">
      <g clip-path="url(#cLine5)">
        <text y="0">
          <tspan fill="#CBD5E1">    tx.send</tspan>(<tspan fill="#F59E0B">Event</tspan>::<tspan fill="#10B981">SystemReady</tspan>(<tspan fill="#10B981">"eBPF Probe Attached"</tspan>)).<tspan fill="#F43F5E">await</tspan>?;
        </text>
      </g>
    </g>

    <!-- Line 6: Types 7.5s -> 9.0s -->
    <g transform="translate(0, 182)">
      <g clip-path="url(#cLine6)">
        <text y="0">
          <tspan fill="#10B981">    Ok</tspan>((<tspan fill="#38BDF8">println!</tspan>(<tspan fill="#10B981">"✔ Kernel Security Loop Active"</tspan>)))
        </text>
      </g>
    </g>

    <!-- Line 7: Types 9.0s -> 10.5s -->
    <g transform="translate(0, 208)">
      <g clip-path="url(#cLine7)">
        <text y="0" fill="#E2E8F0">}</text>
      </g>
    </g>

    <!-- SYNCHRONIZED TYPING CURSOR (MOVES TOP-TO-BOTTOM LINE BY LINE) -->
    <g>
      <rect width="10" height="18" fill="#00F5FF" filter="url(#glowCyan)">
        <!-- Vertical Top-to-Bottom Line Steps -->
        <animate attributeName="y" values="36; 62; 88; 114; 140; 166; 192; 192; 36" 
                 keyTimes="0; 0.11; 0.22; 0.33; 0.44; 0.55; 0.66; 0.90; 1" dur="14s" repeatCount="indefinite" />
        
        <!-- Horizontal Typing Moves across each line -->
        <animate attributeName="x" values="0; 520; 0; 480; 0; 560; 0; 430; 0; 590; 0; 460; 0; 25; 0" 
                 keyTimes="0; 0.11; 0.12; 0.22; 0.23; 0.33; 0.34; 0.44; 0.45; 0.55; 0.56; 0.66; 0.67; 0.77; 1" dur="14s" repeatCount="indefinite" />
        
        <!-- Blinking opacity -->
        <animate attributeName="opacity" values="1; 0.2; 1" dur="0.4s" repeatCount="indefinite" />
      </rect>
    </g>

  </g>

  <!-- BOTTOM TERMINAL LOG STREAM -->
  <rect x="48" y="325" width="892" height="115" fill="#030712" />
  <rect x="48" y="325" width="892" height="24" fill="#0f172a" />
  <text x="64" y="341" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#38BDF8">🖥️ TERMINAL — cargo run --release --bin kernel_sentinel</text>

  <g font-family="'Fira Code', monospace" font-size="11" font-weight="bold" transform="translate(64, 368)">
    <text y="0" fill="#10B981">[+] [0.001s] Compiling kernel_engine v1.0.0 (c:\Users\muham\Music\istagram)</text>
    <text y="20" fill="#38BDF8">[+] [0.005s] [OK] eBPF Ring Buffer attached to kernel syscalls (0.0001s latency)</text>
    <text y="40" fill="#10B981">[+] [0.012s] [STATUS] Zero-Trust Sentinel Active • 0 Security advisories flagged</text>
  </g>
</svg>
