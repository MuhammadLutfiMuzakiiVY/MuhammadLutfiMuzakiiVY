<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>

    <!-- Glow Effects -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <!-- TYPING CLIP-PATHS (Sequential Line Reveal) -->
    <clipPath id="clipLine1">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0; 0; 580; 580; 0" keyTimes="0; 0.05; 0.25; 0.95; 1" dur="10s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <clipPath id="clipLine2">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0; 0; 520; 520; 0" keyTimes="0; 0.25; 0.45; 0.95; 1" dur="10s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <clipPath id="clipLine3">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0; 0; 610; 610; 0" keyTimes="0; 0.45; 0.65; 0.95; 1" dur="10s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <clipPath id="clipLine4">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0; 0; 480; 480; 0" keyTimes="0; 0.65; 0.85; 0.95; 1" dur="10s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <!-- IDE Window Body -->
  <rect width="920" height="400" rx="10" fill="url(#ideBg)" stroke="#00F5FF" stroke-width="1.5" filter="url(#glowCyan)" />

  <!-- Top Bar -->
  <rect width="920" height="36" rx="10" fill="#0f172a" />
  <circle cx="20" cy="18" r="5.5" fill="#EF4444" />
  <circle cx="36" cy="18" r="5.5" fill="#F59E0B" />
  <circle cx="52" cy="18" r="5.5" fill="#10B981" filter="url(#glowGreen)" />

  <!-- IDE Tabs -->
  <g font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11" font-weight="bold">
    <rect x="80" y="6" width="150" height="30" rx="4" fill="#1e293b" stroke="#00F5FF" stroke-width="0.8" />
    <text x="96" y="25" fill="#00F5FF">🦀 kernel_engine.rs</text>

    <rect x="236" y="6" width="140" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
    <text x="250" y="25" fill="#64748B">🧠 model_cot.py</text>
  </g>

  <!-- Sidebar File Explorer Icons -->
  <rect x="0" y="36" width="46" height="364" fill="#090d16" />
  <g font-size="14" text-anchor="middle" fill="#64748B">
    <text x="23" y="68" fill="#00F5FF">📁</text>
    <text x="23" y="108">🔍</text>
    <text x="23" y="148">🌿</text>
    <text x="23" y="188" fill="#10B981">⚡</text>
    <text x="23" y="228">⚙️</text>
  </g>

  <!-- Editor Line Numbers -->
  <g font-family="'Fira Code', monospace" font-size="11" fill="#334155" font-weight="bold">
    <text x="62" y="70">01</text>
    <text x="62" y="95">02</text>
    <text x="62" y="120">03</text>
    <text x="62" y="145">04</text>
    <text x="62" y="170">05</text>
    <text x="62" y="195">06</text>
    <text x="62" y="220">07</text>
    <text x="62" y="245">08</text>
    <text x="62" y="270">09</text>
    <text x="62" y="295">10</text>
  </g>

  <!-- REALISTIC RUST CODE WITH CHARACTER-BY-CHARACTER TYPING ANIMATION -->
  <g font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="bold" transform="translate(90, 70)">

    <!-- Static Header Lines -->
    <text y="0"><tspan fill="#64748B">// Real-Time eBPF Kernel Probe &amp; Async Telemetry Stream</tspan></text>
    <text y="25"><tspan fill="#F43F5E">use</tspan> <tspan fill="#F59E0B">tokio::sync::mpsc</tspan>;</text>
    <text y="50"><tspan fill="#F43F5E">use</tspan> <tspan fill="#F59E0B">aya::programs::KProbe</tspan>;</text>
    <text y="75"></text>

    <!-- Line 1: Typing animation -->
    <g transform="translate(0, 100)">
      <g clip-path="url(#clipLine1)">
        <text y="0">
          <tspan fill="#F43F5E">pub async fn</tspan> <tspan fill="#38BDF8">init_kernel_sentinel</tspan>(rx: &amp;<tspan fill="#F43F5E">mut</tspan> Receiver) -&gt; <tspan fill="#10B981">Result&lt;()&gt;</tspan> {
        </text>
      </g>
    </g>

    <!-- Line 2: Typing animation -->
    <g transform="translate(0, 125)">
      <g clip-path="url(#clipLine2)">
        <text y="0">
          <tspan fill="#94A3B8">    let</tspan> <tspan fill="#F43F5E">mut</tspan> bpf = <tspan fill="#F59E0B">Bpf</tspan>::load_file(<tspan fill="#10B981">"target/ebpf/sentinel.bpf.o"</tspan>)?;&#160;
        </text>
      </g>
    </g>

    <!-- Line 3: Typing animation -->
    <g transform="translate(0, 150)">
      <g clip-path="url(#clipLine3)">
        <text y="0">
          <tspan fill="#94A3B8">    let</tspan> probe: &amp;<tspan fill="#F43F5E">mut</tspan> <tspan fill="#F59E0B">KProbe</tspan> = bpf.program_mut(<tspan fill="#10B981">"sys_enter_execve"</tspan>)? try_into()?;
        </text>
      </g>
    </g>

    <!-- Line 4: Typing animation -->
    <g transform="translate(0, 175)">
      <g clip-path="url(#clipLine4)">
        <text y="0">
          <tspan fill="#38BDF8">    probe.attach</tspan>(<tspan fill="#10B981">"sys_enter_execve"</tspan>, <tspan fill="#00F5FF">0</tspan>)?; <tspan fill="#64748B">// Ring 0 Probe Active</tspan>
        </text>
      </g>
    </g>

    <!-- Static Closing Brace -->
    <text y="200" fill="#E2E8F0">}</text>

    <!-- REAL MOVING TYPING CURSOR -->
    <g>
      <rect x="0" y="162" width="9" height="17" fill="#00F5FF" filter="url(#glowCyan)">
        <animate attributeName="x" values="0; 560; 500; 590; 470; 0" keyTimes="0; 0.25; 0.45; 0.65; 0.85; 1" dur="10s" repeatCount="indefinite" />
        <animate attributeName="y" values="85; 85; 110; 135; 160; 85" keyTimes="0; 0.25; 0.45; 0.65; 0.85; 1" dur="10s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1; 0; 1" dur="0.4s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- INTEGRATED TERMINAL AT BOTTOM -->
  <rect x="46" y="295" width="874" height="105" fill="#030712" />
  <rect x="46" y="295" width="874" height="22" fill="#0f172a" />
  <text x="60" y="310" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#38BDF8">🖥️ TERMINAL — cargo run --release --bin kernel_sentinel</text>

  <!-- Terminal Typing & Logs Output -->
  <g font-family="'Fira Code', monospace" font-size="11" font-weight="bold" transform="translate(60, 335)">
    <text y="0" fill="#10B981">[+] [0.001s] Compiling ebpf_sentinel v1.0.0 (c:\Users\muham\Music\istagram)</text>
    <text y="18" fill="#38BDF8">[+] [0.005s] [OK] eBPF Ring Buffer attached to kernel syscalls (0.0001s latency)</text>
    <text y="36" fill="#F43F5E">[+] [0.012s] [STATUS] Zero-Trust Sentinel Active • 0 Security advisories flagged</text>
  </g>
</svg>
