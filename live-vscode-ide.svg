<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="420">
  <defs>
    <linearGradient id="ideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0a0f24" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#7B61FF" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <pattern id="matrixGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00F5FF" stroke-width="0.3" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Outer Window Frame -->
  <rect width="920" height="420" rx="12" fill="url(#ideBg)" stroke="#00F5FF" stroke-width="1.8" filter="url(#glowCyan)" />
  <rect width="920" height="420" rx="12" fill="url(#matrixGrid)" />

  <!-- IDE Header Tab Bar -->
  <rect x="0" y="0" width="920" height="38" rx="12" fill="#080e1e" stroke="#00F5FF" stroke-width="0.5" />
  <circle cx="24" cy="19" r="6" fill="#FF5F56" />
  <circle cx="42" cy="19" r="6" fill="#FFBD2E" />
  <circle cx="60" cy="19" r="6" fill="#27C93F" filter="url(#glowGreen)" />

  <!-- Active Tabs -->
  <g font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11" font-weight="bold">
    <rect x="90" y="8" width="160" height="30" rx="6" fill="#111c38" stroke="#00F5FF" stroke-width="1" />
    <text x="104" y="27" fill="#00F5FF">🦀 main_agent.rs</text>

    <rect x="256" y="8" width="160" height="30" rx="6" fill="#091124" stroke="#1E293B" stroke-width="1" />
    <text x="270" y="27" fill="#7B61FF">🧠 deep_reasoning.py</text>

    <rect x="422" y="8" width="150" height="30" rx="6" fill="#091124" stroke="#1E293B" stroke-width="1" />
    <text x="436" y="27" fill="#FF007F">🛡️ ebpf_filter.c</text>
  </g>

  <!-- Sidebar File Explorer -->
  <rect x="0" y="38" width="48" height="382" fill="#050a17" stroke="#111c3a" stroke-width="1" />
  <g font-size="15" text-anchor="middle" x="24">
    <text x="24" y="70" fill="#00F5FF">📁</text>
    <text x="24" y="110" fill="#7B61FF">🔍</text>
    <text x="24" y="150" fill="#FF007F">🌿</text>
    <text x="24" y="190" fill="#00FF66">⚡</text>
    <text x="24" y="230" fill="#00F5FF">🤖</text>
    <text x="24" y="270" fill="#FFB000">⚙️</text>
  </g>

  <!-- SCANNING LASER BEAM -->
  <line x1="48" y1="40" x2="920" y2="40" stroke="#00F5FF" stroke-width="1.5" filter="url(#glowCyan)" opacity="0.8">
    <animate attributeName="y1" values="40;410;40" dur="3s" repeatCount="indefinite" />
    <animate attributeName="y2" values="40;410;40" dur="3s" repeatCount="indefinite" />
  </line>

  <!-- LEFT PANE: RUST ASYNC AGENT CODE -->
  <g font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11" font-weight="bold">
    <!-- Line numbers -->
    <g fill="#334155" font-size="10">
      <text x="62" y="65">01</text>
      <text x="62" y="85">02</text>
      <text x="62" y="105">03</text>
      <text x="62" y="125">04</text>
      <text x="62" y="145">05</text>
      <text x="62" y="165">06</text>
      <text x="62" y="185">07</text>
      <text x="62" y="205">08</text>
      <text x="62" y="225">09</text>
      <text x="62" y="245">10</text>
    </g>

    <!-- Code Block 1 (Rust Code Stream) -->
    <g transform="translate(90, 65)">
      <text y="0"><tspan fill="#FF007F">pub async fn</tspan> <tspan fill="#00F5FF">spawn_ai_agent</tspan>(config: &amp;<tspan fill="#FFB000">AgentConfig</tspan>) -&gt; <tspan fill="#00FF66">Result&lt;Agent, EngineErr&gt;</tspan> {</text>
      <text y="20">    <tspan fill="#7B61FF">let</tspan> model = <tspan fill="#FFB000">AutoModel</tspan>::from_pretrained(<tspan fill="#00FF66">"litera-70b-deepseek"</tspan>)?;</text>
      <text y="40">    <tspan fill="#7B61FF">let</tspan> <tspan fill="#FF007F">mut</tspan> swarm = <tspan fill="#FFB000">SwarmOrchestrator</tspan>::new(config.max_threads);</text>
      <text y="60">    swarm.<tspan fill="#00F5FF">attach_ebpf_sentinel</tspan>(<tspan fill="#00FF66">"/dev/kmem_filter"</tspan>).<tspan fill="#FF007F">await</tspan>?;</text>
      <text y="80">    <tspan fill="#7B61FF">tokio::spawn</tspan>(<tspan fill="#FF007F">async move</tspan> {</text>
      <text y="100">        <tspan fill="#FF007F">while let</tspan> <tspan fill="#FFB000">Some</tspan>(task) = swarm.<tspan fill="#00F5FF">next_task</tspan>().<tspan fill="#FF007F">await</tspan> {</text>
      <text y="120">            model.<tspan fill="#00F5FF">infer_cot_reasoning</tspan>(&amp;task).<tspan fill="#FF007F">await</tspan>?;</text>
      <text y="140">        }</text>
      <text y="160">    });</text>
      <text y="180">    <tspan fill="#00FF66">Ok</tspan>(<tspan fill="#FFB000">Agent</tspan>::active())</text>
      <text y="200">}</text>

      <!-- Scrolling Animation for Rust Code -->
      <animateTransform attributeName="transform" type="translate" values="90, 65; 90, 55; 90, 65" dur="4s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- SPLIT DIVIDER -->
  <line x1="500" y1="38" x2="500" y2="280" stroke="#1E293B" stroke-width="1.5" />

  <!-- RIGHT PANE: PYTHON DEEP LEARNING MODEL -->
  <g font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11" font-weight="bold">
    <!-- Line numbers -->
    <g fill="#334155" font-size="10">
      <text x="515" y="65">01</text>
      <text x="515" y="85">02</text>
      <text x="515" y="105">03</text>
      <text x="515" y="125">04</text>
      <text x="515" y="145">05</text>
      <text x="515" y="165">06</text>
      <text x="515" y="185">07</text>
      <text x="515" y="205">08</text>
      <text x="515" y="225">09</text>
      <text x="515" y="245">10</text>
    </g>

    <!-- Code Block 2 (Python AI Code) -->
    <g transform="translate(540, 65)">
      <text y="0"><tspan fill="#FF007F">class</tspan> <tspan fill="#FFB000">LiteraReasoningEngine</tspan>(nn.Module):</text>
      <text y="20">    <tspan fill="#FF007F">def</tspan> <tspan fill="#00F5FF">__init__</tspan>(self, dim=<tspan fill="#00FF66">8192</tspan>, layers=<tspan fill="#00FF66">80</tspan>):</text>
      <text y="40">        super().__init__()</text>
      <text y="60">        self.attn = <tspan fill="#FFB000">FlashAttention3</tspan>(dim, heads=<tspan fill="#00FF66">64</tspan>)</text>
      <text y="80">        self.cot_decoder = <tspan fill="#FFB000">TransformerBlock</tspan>(layers)</text>
      <text y="100"></text>
      <text y="120">    <tspan fill="#FF007F">def</tspan> <tspan fill="#00F5FF">forward</tspan>(self, x, mask=<tspan fill="#7B61FF">None</tspan>):</text>
      <text y="140">        ctx = self.attn(x, mask)</text>
      <text y="160">        <tspan fill="#FF007F">return</tspan> self.cot_decoder(ctx)</text>
      <text y="180"># <tspan fill="#00FF66">STATUS: INFERENCE ACTIVE [850 tokens/sec]</tspan></text>
      <text y="200"># <tspan fill="#00F5FF">LOSS: 0.00012 | ACCURACY: 99.98%</tspan></text>

      <!-- Scrolling Animation for Python Code -->
      <animateTransform attributeName="transform" type="translate" values="540, 65; 540, 75; 540, 65" dur="3.5s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- BOTTOM INTEGRATED TERMINAL -->
  <rect x="48" y="280" width="872" height="140" fill="#040814" stroke="#111c3a" stroke-width="1" />
  <rect x="48" y="280" width="872" height="24" fill="#091124" />
  <text x="64" y="296" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#00F5FF">🖥️ TERMINAL — cargo run --bin autonomous_system --release</text>

  <!-- TERMINAL LIVE OUTPUT STREAM -->
  <g font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11" font-weight="bold" transform="translate(64, 320)">
    <text y="0" fill="#00FF66">[+] [0.001s] [INFO] Swarm Engine initialized on 64 CPU Cores &amp; 4x H100 GPUs</text>
    <text y="18" fill="#00F5FF">[+] [0.003s] [OK]   eBPF Kernel Probe hooked to sys_enter_execve (Ring 0 Active)</text>
    <text y="36" fill="#7B61FF">[+] [0.008s] [OK]   Litera-70B DeepReasoning model loaded in 4-bit KV Cache</text>
    <text y="54" fill="#FF007F">[+] [0.012s] [RUN]  Executing autonomous self-healing security loop... <tspan fill="#00FF66">[SUCCESS]</tspan></text>

    <animateTransform attributeName="transform" type="translate" values="64, 320; 64, 310; 64, 320" dur="2s" repeatCount="indefinite" />
  </g>

  <!-- BLINKING TERMINAL CURSOR -->
  <rect x="580" y="369" width="8" height="14" fill="#00F5FF" filter="url(#glowCyan)">
    <animate attributeName="opacity" values="1;0;1" dur="0.5s" repeatCount="indefinite" />
  </rect>
</svg>
