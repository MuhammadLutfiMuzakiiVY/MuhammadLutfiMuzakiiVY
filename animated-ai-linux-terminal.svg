<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="340">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <clipPath id="clipTermCmd">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0; 0; 520; 520; 0" keyTimes="0; 0.1; 0.5; 0.95; 1" dur="7s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <rect width="920" height="340" rx="10" fill="url(#termBg)" stroke="#10B981" stroke-width="1.5" filter="url(#glowGreen)" />

  <!-- Terminal Top Bar -->
  <rect width="920" height="34" rx="10" fill="#0f172a" />
  <circle cx="20" cy="17" r="5.5" fill="#EF4444" />
  <circle cx="36" cy="17" r="5.5" fill="#F59E0B" />
  <circle cx="52" cy="17" r="5.5" fill="#10B981" filter="url(#glowGreen)" />
  <text x="460" y="22" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#10B981" text-anchor="middle">root@lutfi-workstation:~# zsh</text>

  <!-- TERMINAL CONTENT WITH REAL TYPING COMMAND -->
  <g font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="bold" transform="translate(24, 65)">

    <!-- Command 1 Static Prompt -->
    <text y="0" fill="#38BDF8">root@lutfi-workstation:<tspan fill="#10B981">~/projects</tspan># </text>

    <!-- Command 1 Typed Text (Char by Char) -->
    <g transform="translate(230, 0)">
      <g clip-path="url(#clipTermCmd)">
        <text y="0" fill="#F8FAFC">git commit -m "feat: implement deep reasoning LLM pipeline"</text>
      </g>
    </g>

    <!-- Moving Cursor for Command 1 -->
    <rect x="230" y="-12" width="9" height="16" fill="#10B981" filter="url(#glowGreen)">
      <animate attributeName="x" values="230; 230; 745; 745; 230" keyTimes="0; 0.1; 0.5; 0.95; 1" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="0.4s" repeatCount="indefinite" />
    </rect>

    <!-- Terminal Execution Outputs -->
    <g transform="translate(0, 30)">
      <text y="0" fill="#10B981">[main a8f921e] feat: implement deep reasoning LLM pipeline</text>
      <text y="22" fill="#94A3B8"> 4 files changed, 340 insertions(+), 12 deletions(-)</text>
      <text y="44" fill="#38BDF8">[+] Pushing to origin main (https://github.com/MuhammadLutfiMuzakiiVY)...</text>
      <text y="66" fill="#10B981">✔ Deploy successful to production server (0.24s)</text>
    </g>

    <!-- Command 2 Prompt & Output -->
    <g transform="translate(0, 130)">
      <text y="0" fill="#38BDF8">root@lutfi-workstation:<tspan fill="#10B981">~/projects</tspan># <tspan fill="#F8FAFC">systemctl status litera-agent.service</tspan></text>
      <text y="22" fill="#10B981">● litera-agent.service - Litera Autonomous AI Agent Core</text>
      <text y="44" fill="#94A3B8">   Loaded: loaded (/etc/systemd/system/litera-agent.service; enabled)</text>
      <text y="66" fill="#10B981">   Active: active (running) since Wed 2026-07-29 16:30:00 UTC</text>
      <text y="88" fill="#38BDF8">   Tasks: 64 (limit: 49152) | Memory: 1.2G | CPU: 0.12%</text>
      <text y="110" fill="#F43F5E">   Logs: [OK] Zero Security Advisories Flagged • All 108 PRs Verified</text>
    </g>

  </g>
</svg>
