<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="220">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#09142b" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#7B61FF" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <pattern id="matrixPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00F5FF" stroke-width="0.4" stroke-dasharray="3,3" opacity="0.15" />
    </pattern>
  </defs>

  <!-- Banner Frame -->
  <rect width="960" height="220" rx="14" fill="url(#heroBg)" stroke="#00F5FF" stroke-width="2" filter="url(#glowCyan)" />
  <rect width="960" height="220" rx="14" fill="url(#matrixPattern)" />

  <!-- ANIMATED MATRIX CODE STREAMS IN BACKGROUND -->
  <g font-family="'Fira Code', monospace" font-size="11" fill="#00F5FF" opacity="0.25">
    <text x="30" y="30">01010110 11001010 01011100 10101111 00110011 11010101 01010110 11001010</text>
    <text x="30" y="70">10110100 00110101 11100101 01010110 11001010 01011100 10101111 00110011</text>
    <text x="30" y="110">01011100 10101111 00110011 11010101 01010110 11001010 01011100 10101111</text>
    <text x="30" y="150">11001010 01011100 10101111 00110011 11010101 01010110 11001010 01011100</text>
    <text x="30" y="190">00110011 11010101 01010110 11001010 01011100 10101111 00110011 11010101</text>
    <animateTransform attributeName="transform" type="translate" values="0, 0; 0, -10; 0, 0" dur="4s" repeatCount="indefinite" />
  </g>

  <!-- HEADER TOP BAR STATUS -->
  <rect x="20" y="15" width="920" height="32" rx="6" fill="#071124" stroke="#00F5FF" stroke-width="0.8" />
  <circle cx="40" cy="31" r="5" fill="#FF5F56" />
  <circle cx="56" cy="31" r="5" fill="#FFBD2E" />
  <circle cx="72" cy="31" r="5" fill="#27C93F" filter="url(#glowCyan)" />

  <text x="100" y="36" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#00FF66">● SYSTEM_ONLINE | LIVE CODING MATRIX ACTIVE</text>
  <text x="830" y="36" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#00F5FF">⚡ 0.12ms RTT</text>

  <!-- MAIN NAME BANNER -->
  <g text-anchor="middle">
    <text x="480" y="105" font-family="'Inter', 'Fira Code', sans-serif" font-size="34" font-weight="900" fill="url(#textGrad)" letter-spacing="3" filter="url(#glowCyan)">
      MUHAMMAD LUTFI MUZAKI
    </text>
    
    <!-- SUBTITLE BADGES -->
    <text x="480" y="140" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" fill="#FFFFFF">
      SENIOR AI ENGINEER &amp; FULL-STACK ARCHITECT • CYBERSECURITY SENTINEL
    </text>

    <!-- MOVING CODE TICKER -->
    <rect x="140" y="160" width="680" height="30" rx="6" fill="#071124" stroke="#7B61FF" stroke-width="1" />
    <text x="480" y="180" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#00F5FF">
      pub async fn spawn_ai_agent() -&gt; Result&lt;Agent, EngineErr&gt; { [LITERA-AI LABS FOUNDER] }
    </text>
  </g>
</svg>
